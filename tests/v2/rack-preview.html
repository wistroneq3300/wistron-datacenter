<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>PA Three adapter regression fixture</title><style>html,body{margin:0;width:100%;height:100%;background:#091116}canvas{display:block;width:100%;height:100%}</style><script type="importmap">{"imports":{"three":"/vendor/three.module.js"}}</script></head><body><canvas id="preview"></canvas>
<script src="/vendor/pa-cycle/rack-equipment-scene.js"></script><script src="/vendor/pa-cycle/l10-hardware.js"></script><script src="/vendor/pa-cycle/l10-timeline.js"></script><script src="/vendor/pa-cycle/core-scene.js"></script>
<script type="module">
import * as THREE from 'three';import {PAStudio} from '/modules/scene/pa-material.js';import {GeometryPool,RackRig} from '/modules/scene/rack-adapter.js';import {L10Library,attachL10} from '/modules/scene/l10-assets.js';import {OrbitControls} from '/vendor/OrbitControls.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x091116);const camera=new THREE.PerspectiveCamera(28.65,innerWidth/innerHeight,.01,100);const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('preview'),antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.toneMapping=THREE.NoToneMapping;
scene.add(new THREE.HemisphereLight(0xe6edf0,0x162020,1.5));const key=new THREE.DirectionalLight(0xffffff,3);key.position.set(-3,5,4);scene.add(key);
const studio=new PAStudio(renderer,scene);await studio.loading;const pool=new GeometryPool();const doc=await (await fetch('/data/demo-config.json')).json();const rack=structuredClone(doc.racks[0]);rack.positionMm=[0,0,0];const rig=new RackRig(studio,pool,rack,doc.rackProfiles[0],doc.equipment.filter(e=>e.rackId===rack.id),doc.catalog);scene.add(rig.group);studio.setFocus(rig);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.copy(rig.group.position);camera.position.copy(rig.group.position).add(new THREE.Vector3(-2.65,.45,5.3));controls.update();
const library=new L10Library(studio);
window.preview={scene,camera,renderer,rig,studio,pool,controls,library,async detail(){const item=[...rig.items.values()].find(i=>i.model.kind==='system');const detail=await attachL10(library,rig,item);rig.extracted=item.instance.id;rig.doorTarget=rig.doorValue=1;rig.door.rotation.y=-Math.PI*.72;item.extract=1;rig.update(0);const center=detail.bounds().getCenter(new THREE.Vector3());controls.target.copy(center);camera.position.copy(center).add(new THREE.Vector3(-.35,.90,1.3));camera.fov=32;camera.updateProjectionMatrix();controls.update();return detail;},setView(yaw=0){const target=rig.group.position;camera.position.copy(target).add(new THREE.Vector3(Math.sin(yaw)*5.9,.45,Math.cos(yaw)*5.9));controls.target.copy(target);controls.update();},ready:true};
let last=performance.now();function tick(now){const dt=Math.min(.05,(now-last)/1000);last=now;rig.update(dt);studio.shadow();renderer.render(scene,camera);requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></body></html>
